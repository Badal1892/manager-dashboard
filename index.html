<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="glass">
  <div>
    <button>☰</button>
    <span>Devantra ERP</span>
  </div>

  <div class="header-right">
    <div class="profile" onclick="toggleProfile()">
      👤
      <div class="dropdown" id="profileDropdown">
        <p>My Profile</p>
        <p>Settings</p>
        <p>Logout</p>
      </div>
    </div>
  </div>
</header>

<div class="container">

<aside id="sidebar" class="glass"></aside>

<main>

<div id="cards"></div>

<div class="actions glass">
  <button onclick="openModal('taskModal')">Assign Task</button>
  <button>Manage Leaves</button>
  <button onclick="openModal('memberModal')">Add Member</button>
  <button>View Reports</button>
</div>

<div class="card glass">
  <h3>Performance</h3>
  ⭐⭐⭐⭐☆
  <span class="badge">3 New</span>
</div>

<div class="card glass">
  <h3>Progress</h3>
  <svg width="100" height="100">
    <circle cx="50" cy="50" r="40" stroke="gray" stroke-width="8" fill="none"/>
    <circle cx="50" cy="50" r="40" stroke="lime" stroke-width="8"
      stroke-dasharray="251"
      stroke-dashoffset="60"
      fill="none"/>
  </svg>
</div>

<div class="grid">
  <div class="box glass" id="team"></div>
  <div class="box glass" id="activity"></div>
  <div class="box glass" id="tasks"></div>
</div>

</main>
</div>

<div id="overlay"></div>

<!-- MEMBER MODAL -->
<div class="modal glass" id="memberModal">
<form onsubmit="createMember(event)">
<h3>Add Member</h3>

<input id="name" placeholder="Full Name"><br><br>
<input id="empId" placeholder="Employee ID"><br><br>
<input id="role" placeholder="Role"><br><br>
<input id="email" placeholder="Email"><br><br>

<button>Submit</button>
<button type="button" onclick="closeModal('memberModal')">Close</button>
</form>
</div>

<!-- TASK MODAL -->
<div class="modal glass" id="taskModal">
<form onsubmit="assignTask(event)">
<h3>Assign Task</h3>
<input id="taskName" placeholder="Task Name"><br><br>
<input id="assignee" placeholder="Assignee"><br><br>
<input id="deadline" placeholder="Deadline"><br><br>
<input id="hours" placeholder="Hours"><br><br>
<button>Submit</button>
<button type="button" onclick="closeModal('taskModal')">Close</button>
</form>
</div>

<div id="toast"></div>

<script type="module" src="script.js"></script>
</body>
</html>
